---
.gitlab-ci.yml:
  delete: true
.rubocop.yml:
  include_todos: true
.travis.yml:
  delete: true
appveyor.yml:
  delete: true
Rakefile:
  requires:
    - 'puppet-strings/tasks'
  # puppet-lint checks the module disabled by hand (Rakefile/.puppet-lint.rc) (MODULES-11997 pdk update)
  extra_disabled_lint_checks:
  - strict_indent
.github/workflows/ci.yml:
  unmanaged: true
.github/workflows/nightly.yml:
  unmanaged: true
  cron: '35 3 * * *'
.github/workflows/release.yml:
  unmanaged: false
.github/workflows/release_prep.yml:
  unmanaged: false
.gitignore:
  paths:
    - '!/spec/fixtures/modules/redact/'
